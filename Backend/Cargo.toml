[package]
name = "Backend"
version = "0.1.0"
edition = "2024"
default-run = "Backend"

[dependencies]
actix-web = "4.10"
serde_json = "1.0"
dotenv = "0.15"
sqlx = "0.8.3"
uuid = {version =  "1.16.0", features = ["serde", "v4"] }
jsonwebtoken = "9.3.1"
reqwest = "0.12.14"
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "macros"] }
base64 = "0.22.1"
config = "0.15.11"
serde = {version = "1.0.219", features = ["derive"]}
once_cell = "1.21.1"
actix-cors = "0.7.1"
redis = "0.29.2"
env_logger = "0.11.7"
chrono = "0.4.40"
argon2 = { version = "0.5.3", features = ["std"] }
actix-web-httpauth = "0.8.2"
rand = "0.9.0"
