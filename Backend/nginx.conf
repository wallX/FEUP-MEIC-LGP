worker_processes  1;

events {
    worker_connections  1024;
}

http {
    upstream app {
        #use app if running in docker or host.docker.internal if running on host
        server app:8080;
        #server host.docker.internal:8080;
    }

    upstream tusd {
        server tusd:1080;
    }

    server {
        listen 80;
        server_name yourdomain.com;
        underscores_in_headers on;

        location /stub_status {
                stub_status;
                allow 127.0.0.1;
                allow 172.0.0.0/8;  # Allow Docker network range
                deny all;
        }

        location /api/ {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;

            proxy_http_version 1.1;
            proxy_set_header Connection "keep-alive";
        }

        location /upload/ {
            access_by_lua_block {
                ngx.req.set_header("User-Role", "User")
                local res = ngx.location.capture("/api/auth", {
                    method = ngx.HTTP_GET,
                    copy_all_vars = true,
                    args = ngx.req.get_uri_args(),
                    ctx = { headers = ngx.req.get_headers() }
                })

                if res.status ~= 200 then
                    ngx.status = res.status or 403
                    ngx.header.content_type = res.header["Content-Type"]
                    ngx.print(res.body)
                    return ngx.exit(res.status)
                end

                ngx.req.set_header("User-Role", "User")
            }

            proxy_pass http://tusd/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            client_max_body_size 0;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /api/auth {
            proxy_pass http://app/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }
    }
}