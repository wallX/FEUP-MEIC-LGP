services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - tusd-network
    depends_on:
      - tusd
  tusd:
    image: tusproject/tusd
    ports:
      - "1080:8080"
    volumes:
      - ./uploads:/srv/tusd-data/data
    command: [
      "-hooks-http",
      "http://host.docker.internal:8080/uploads/hook",
      "-hooks-enabled-events=post-finish",
      "-hooks-http-retry",
      "5"
    ]
    #http://app:8080/uploads/hook
    networks:
      - tusd-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
networks:
  tusd-network:
    driver: bridge